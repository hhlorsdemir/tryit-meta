name: TryIt
options:
  bundleIdPrefix: com.lafagency
  # Kaynak dil Turkce. Ceviriler String Catalog'larda (.xcstrings).
  developmentLanguage: tr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5X592SK4E8
    CODE_SIGN_STYLE: Automatic
    # Koddaki metinler derlemede String Catalog'a cikariliyor.
    SWIFT_EMIT_LOC_STRINGS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"

configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig

targets:
  TryIt:
    type: application
    platform: iOS
    sources:
      - path: TryIt
        # Yalnizca Xcode'da test icin; uygulama paketine girmesin.
        excludes:
          - TryIt.storekit
      - path: Shared
    dependencies:
      - target: TryItShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lafagency.tryit
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: TryIt/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TryIt/TryIt.entitlements

    # Xcode'dan calistirinca satin almalar StoreKit test dosyasiyla,
    # gercek para ve App Store Connect olmadan deneniyor.
    scheme:
      storeKitConfiguration: TryIt/TryIt.storekit

  # Paylas menusunden gelen linkleri kuyruga birakan eklenti.
  TryItShare:
    type: app-extension
    platform: iOS
    sources:
      - path: TryItShare
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lafagency.tryit.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: TryItShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: TryItShare/TryItShare.entitlements
